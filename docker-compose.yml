# PrintForge — self-hosted stack: PostgreSQL, app, one-shot migrations, scheduled backups.
# 1) cp .env.production.example .env.production and fill in secrets
# 2) docker compose --env-file .env.production up -d --build
# The app listens on 127.0.0.1:3000 only; put a TLS reverse proxy (e.g. Caddy) in front
# before exposing it to a network. See docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: printforge
      POSTGRES_USER: printforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Asia/Jerusalem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printforge -d printforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://printforge:${POSTGRES_PASSWORD}@db:5432/printforge
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://printforge:${POSTGRES_PASSWORD}@db:5432/printforge
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /backups
      APP_ENV: ${APP_ENV:-production}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN (protects first-run setup)}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - uploads:/data/uploads
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://printforge:${POSTGRES_PASSWORD}@db:5432/printforge
      BACKUP_DIR: /backups
      UPLOAD_DIR: /data/uploads
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      TZ: Asia/Jerusalem
    volumes:
      - ./scripts:/scripts:ro
      - uploads:/data/uploads:ro
      # Host directory so backups are easy to copy off the machine (see docs/BACKUP.md).
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do sh /scripts/backup.sh || echo 'BACKUP FAILED'; sleep $$(( INTERVAL_HOURS * 3600 )); done"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
